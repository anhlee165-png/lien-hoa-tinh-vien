<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liên Hoa Tịnh Viện</title>
<meta name="description" content="Liên Hoa Tịnh Viện – chùa online: chánh điện, cửa chính, sân chùa, tranh Phật.">
<meta name="theme-color" content="#3d0a0a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23e8b54a' d='M32 8c6 8 8 16 0 30C24 24 26 16 32 8zM10 22c10 2 18 8 20 18-10 0-18-6-20-18zm44 0c-2 12-10 18-20 18 2-10 10-16 20-18zM6 40c10-2 20 2 26 8-10 4-20 2-26-8zm52 0c-6 10-16 12-26 8 6-6 16-10 26-8z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700;800&family=Roboto+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">

    <!-- ===== CẢNH CHÁNH ĐIỆN (camera) ===== -->
    <div id="scene">
      <img id="bg" src="assets/chanh-dien.jpg" alt="Chánh điện Liên Hoa Tịnh Viện: tranh Phật hai bên tường, cửa chính nhìn ra sân chùa" draggable="false">
      <div class="glow" style="left:838px;top:118px;--s:230px"></div>
      <div class="glow" style="left:606px;top:190px;--s:120px;animation-delay:-.7s"></div>
      <div class="glow" style="left:1068px;top:190px;--s:120px;animation-delay:-1.3s"></div>
      <div class="glow" style="left:580px;top:735px;--s:150px;animation-delay:-.4s"></div>
      <div class="glow" style="left:1108px;top:735px;--s:150px;animation-delay:-1.1s"></div>
      <div class="glow small" style="left:250px;top:215px;--s:70px"></div>
      <div class="glow small" style="left:1422px;top:215px;--s:70px;animation-delay:-.9s"></div>
      <div id="smoke-big" class="smoke-src" style="left:842px;top:770px"></div>
      <div id="smoke-yard" class="smoke-src yard" style="left:836px;top:450px"></div>
      <div id="me-tag" style="left:843px;top:609px"></div>
      <div id="me-aura" style="left:843px;top:700px"></div>
    </div>
    <div id="vignette"></div>
    <div id="fx"></div>

    <!-- ===== THANH TRÊN ===== -->
    <header id="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 120 80"><use href="#i-lotus-big"/></svg>
        <div class="brand-text">
          <h1>LIÊN HOA TỊNH VIỆN</h1>
          <p>V16 · CỬA CHÍNH · SÂN CHÙA · TRANH PHẬT</p>
        </div>
      </div>
      <button class="pill" id="hall-btn" style="left:622px;width:240px" aria-haspopup="listbox">
        <svg class="ic"><use href="#i-temple"/></svg>
        <span id="hall-name">Chánh điện 1</span>
        <svg class="ic caret"><use href="#i-caret"/></svg>
      </button>
      <div class="pill" style="left:880px;width:168px">
        <svg class="ic"><use href="#i-users"/></svg>
        <span><b id="online">37</b> / 100</span>
      </div>
      <div class="pill" style="left:1082px;width:280px">
        <svg class="ic wallet"><use href="#i-wallet"/></svg>
        <span>Ví: <b id="wallet">1.250.000</b> đ</span>
        <button class="plus" id="topup" aria-label="Nạp tiền"><svg><use href="#i-plus"/></svg></button>
      </div>
      <button class="pill" id="merit-btn" style="left:1384px;width:196px">
        <svg class="ic lotus"><use href="#i-lotus"/></svg>
        <span>Công đức</span>
      </button>
      <button class="pill round" id="bell-btn" style="left:1601px" aria-label="Thông báo">
        <svg class="ic"><use href="#i-bell"/></svg>
        <i class="dot" id="bell-dot"></i>
      </button>
    </header>

    <div id="hall-menu" class="dropdown" hidden></div>
    <div id="bell-menu" class="dropdown" hidden></div>

    <!-- ===== PANEL TRÁI ===== -->
    <aside id="info" class="panel">
      <div class="row big"><svg class="ic"><use href="#i-users"/></svg><div><b id="info-hall">Chánh điện 1</b><small><span id="info-online">37</span> / 100 người</small></div></div>
      <button class="row" data-open="rooms"><svg class="ic"><use href="#i-list"/></svg><span>20 chánh điện</span></button>
      <button class="row" id="niem-room"><svg class="ic"><use href="#i-lotus"/></svg><span>Phòng niệm Phật</span></button>
    </aside>

    <!-- ===== ĐIỂM NHÌN NHANH ===== -->
    <aside id="views" class="panel">
      <button class="head" id="views-toggle"><svg class="ic"><use href="#i-camera"/></svg><span>Điểm nhìn nhanh</span><svg class="ic caret"><use href="#i-caret"/></svg></button>
      <div class="list">
        <button data-view="all" class="on"><svg class="ic"><use href="#i-image"/></svg>Toàn cảnh</button>
        <button data-view="buddha"><svg class="ic"><use href="#i-buddha"/></svg>Góc Phật</button>
        <button data-view="left"><svg class="ic"><use href="#i-left"/></svg>Tường trái</button>
        <button data-view="right"><svg class="ic"><use href="#i-right"/></svg>Tường phải</button>
        <button data-view="door"><svg class="ic"><use href="#i-gate"/></svg>Cửa chính</button>
      </div>
    </aside>

    <!-- ===== JOYSTICK ===== -->
    <div id="joy" aria-label="Di chuyển">
      <span class="arr up"></span><span class="arr down"></span><span class="arr left"></span><span class="arr right"></span>
      <div id="knob"></div>
    </div>

    <!-- ===== NAV TRÁI DƯỚI ===== -->
    <nav id="nav">
      <button data-open="rooms"><svg class="ic"><use href="#i-home"/></svg>Phòng</button>
      <button class="on" data-open="hall"><svg class="ic"><use href="#i-temple"/></svg>Điện</button>
      <button data-open="wallet"><svg class="ic"><use href="#i-wallet"/></svg>Ví</button>
      <button data-open="merit"><svg class="ic"><use href="#i-lotus"/></svg>Đức</button>
      <button data-open="book"><svg class="ic"><use href="#i-book"/></svg>Sổ</button>
    </nav>

    <!-- ===== THANH HÀNH ĐỘNG ===== -->
    <nav id="actions">
      <button data-act="chaptay"><svg class="ic"><use href="#i-pray"/></svg>Chắp tay</button>
      <button data-act="cuichao"><svg class="ic"><use href="#i-bow"/></svg>Cúi chào</button>
      <button data-act="layphat"><svg class="ic"><use href="#i-prostrate"/></svg>Lạy Phật</button>
      <button data-act="niemphat"><svg class="ic"><use href="#i-lotus"/></svg>Niệm Phật</button>
      <button data-act="thien"><svg class="ic"><use href="#i-meditate"/></svg>Thiền</button>
      <button data-act="nghekinh"><svg class="ic"><use href="#i-headphones"/></svg>Nghe kinh</button>
      <button data-act="chuoihat"><svg class="ic"><use href="#i-beads"/></svg>Chuỗi hạt</button>
      <button data-act="thaphuong"><svg class="ic"><use href="#i-incense"/></svg>Thắp hương</button>
      <button data-act="rangoai" class="exit"><svg class="ic"><use href="#i-exit"/></svg><span id="exit-label">Ra ngoài</span></button>
    </nav>

    <!-- ===== ÂM LƯỢNG ===== -->
    <div id="volume">
      <button id="mute" aria-label="Tắt/bật tiếng"><svg class="ic"><use href="#i-volume"/></svg></button>
      <input id="vol" type="range" min="0" max="100" value="70" aria-label="Âm lượng">
      <button id="gear" aria-label="Cài đặt"><svg class="ic"><use href="#i-gear"/></svg></button>
    </div>

    <div id="status" hidden></div>
    <div id="toast"></div>

    <!-- ===== MODAL ===== -->
    <div id="modal" hidden>
      <div class="sheet">
        <button class="close" aria-label="Đóng">×</button>
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>
  <div id="rotate">Xoay ngang điện thoại để vào chánh điện trọn vẹn 🙏</div>
</div>

<!-- ===== ICON SPRITE ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".55" stop-color="#e8b54a"/><stop offset="1" stop-color="#a86d1c"/></linearGradient>
  </defs>
  <symbol id="i-lotus-big" viewBox="0 0 120 80">
    <g fill="url(#gold)" stroke="#7a4a10" stroke-width="1.2">
      <path d="M60 4c9 12 12 26 0 50C48 30 51 16 60 4z"/>
      <path d="M38 14c12 4 20 18 20 38-14-6-22-20-20-38z"/>
      <path d="M82 14c2 18-6 32-20 38 0-20 8-34 20-38z"/>
      <path d="M16 30c16 0 32 10 40 24-18 2-34-6-40-24z"/>
      <path d="M104 30c-6 18-22 26-40 24 8-14 24-24 40-24z"/>
      <path d="M4 50c18-4 38 2 52 8-16 8-38 8-52-8z"/>
      <path d="M116 50c-14 16-36 16-52 8 14-6 34-12 52-8z"/>
      <path d="M30 64c18 4 42 4 60 0-6 8-20 12-30 12s-24-4-30-12z"/>
    </g>
  </symbol>
  <symbol id="i-lotus" viewBox="0 0 32 32"><path fill="currentColor" d="M16 3c3 4 4 9 0 16-4-7-3-12 0-16zM8 8c4 1 7 6 7 11-5-2-8-6-7-11zm16 0c1 5-2 9-7 11 0-5 3-10 7-11zM2 15c5-1 10 2 13 5-6 1-11-1-13-5zm28 0c-2 4-7 6-13 5 3-3 8-6 13-5zM4 22c6 2 18 2 24 0-2 4-7 6-12 6s-10-2-12-6z"/></symbol>
  <symbol id="i-temple" viewBox="0 0 32 32"><path fill="currentColor" d="M16 2 2 9v3h28V9L16 2zm0 3 8 4H8l8-4zM4 14h24v2H4zm2 3h3v9H6zm6 0h3v9h-3zm5 0h3v9h-3zm6 0h3v9h-3zM2 27h28v3H2z"/></symbol>

  <symbol id="i-wallet" viewBox="0 0 32 32"><path fill="#f4b73d" d="M3 9c0-2 1.5-3.5 3.5-3.5H24V9H3z"/><rect x="2" y="8" width="27" height="20" rx="3" fill="#e9a52c"/><rect x="18" y="14" width="13" height="8" rx="2" fill="#c47f12"/><circle cx="22.5" cy="18" r="1.8" fill="#ffe7a0"/></symbol>
  <symbol id="i-plus" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="url(#gold)"/><path d="M14 8h4v6h6v4h-6v6h-4v-6H8v-4h6z" fill="#5a2a05"/></symbol>
  <symbol id="i-bell" viewBox="0 0 32 32"><path fill="currentColor" d="M16 2a2 2 0 0 1 2 2v1.3c4.6 1 8 5 8 9.7v6l3 4H3l3-4v-6c0-4.7 3.4-8.7 8-9.7V4a2 2 0 0 1 2-2zm-4 25h8a4 4 0 0 1-8 0z"/></symbol>
  <symbol id="i-list" viewBox="0 0 32 32"><path fill="currentColor" d="M3 6h4v4H3zm7 0h19v4H10zM3 14h4v4H3zm7 0h19v4H10zM3 22h4v4H3zm7 0h19v4H10z"/></symbol>
  <symbol id="i-camera" viewBox="0 0 32 32"><path fill="currentColor" d="M11 5h10l2 3h5a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3h5l2-3zm5 7a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm0 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></symbol>
  <symbol id="i-image" viewBox="0 0 32 32"><path fill="currentColor" d="M3 5h26v22H3zm3 3v14l7-8 5 6 3-3 5 5V8zm16 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z" fill-rule="evenodd"/></symbol>
  <symbol id="i-buddha" viewBox="0 0 32 32"><path fill="currentColor" d="M16 2c1.5 0 2.5 1 2.5 2.2 2 .8 3 2.5 3 4.8 0 3-2.4 5.4-5.5 5.4S10.5 12 10.5 9c0-2.3 1-4 3-4.8C13.5 3 14.5 2 16 2zm-6 14h12c2 0 4 3 4 7l3 3c1 1 0 3-2 3H3c-2 0-3-2-2-3l3-3c0-4 2-7 6-7z"/></symbol>
  <symbol id="i-left" viewBox="0 0 32 32"><path fill="currentColor" d="M21 5v22L8 16z"/></symbol>
  <symbol id="i-right" viewBox="0 0 32 32"><path fill="currentColor" d="M11 5v22l13-11z"/></symbol>
  <symbol id="i-gate" viewBox="0 0 32 32"><path fill="currentColor" d="M1 4c5 1 25 1 30 0v4H1zm3 5h4v20H4zm20 0h4v20h-4zM2 11h28v3H2zm9 3h3v15h-3zm7 0h3v15h-3z"/></symbol>
  <symbol id="i-home" viewBox="0 0 32 32"><path fill="currentColor" d="M16 3 1 16h4v13h8v-8h6v8h8V16h4z"/></symbol>
  <symbol id="i-book" viewBox="0 0 32 32"><path fill="currentColor" d="M5 3h19a3 3 0 0 1 3 3v23H8a3 3 0 0 1-3-3zm4 3v18h15V6zm2 3h11v2H11zm0 4h11v2H11zm0 4h8v2h-8zM8 26h17v1H8z"/></symbol>
  <symbol id="i-pray" viewBox="0 0 32 32"><path fill="currentColor" d="M15 2c.6 0 1 .4 1 1v20l-4 7H7l2-6V12l4-9c.4-.6 1.2-1 2-1zm2 0c.8 0 1.6.4 2 1l4 9v12l2 6h-5l-4-7V3c0-.6.4-1 1-1z"/></symbol>
  <symbol id="i-bow" viewBox="0 0 32 32"><circle cx="20" cy="6" r="4" fill="currentColor"/><path fill="currentColor" d="M8 10c3-1 7 0 9 2l3 4-3 2-3-3v15H9V19l-4 4-2-2 5-6z"/></symbol>
  <symbol id="i-prostrate" viewBox="0 0 32 32"><circle cx="8" cy="19" r="4" fill="currentColor"/><path fill="currentColor" d="M13 17c3-4 8-6 12-4l5 3v8H13l-2 2-2-2zM1 25h30v3H1z"/></symbol>

  <symbol id="i-beads" viewBox="0 0 32 32"><g fill="currentColor"><circle cx="16" cy="4" r="2.6"/><circle cx="22.5" cy="6" r="2.6"/><circle cx="26.5" cy="11.5" r="2.6"/><circle cx="26.5" cy="18" r="2.6"/><circle cx="9.5" cy="6" r="2.6"/><circle cx="5.5" cy="11.5" r="2.6"/><circle cx="5.5" cy="18" r="2.6"/><circle cx="9.5" cy="23" r="2.6"/><circle cx="22.5" cy="23" r="2.6"/><path d="M14 25h4l1 6h-6z"/></g></symbol>

  <symbol id="i-exit" viewBox="0 0 32 32"><path fill="currentColor" d="M5 2h16v8h-3V5H8v22h10v-5h3v8H5zm15 9 7 5-7 5v-3h-8v-4h8z"/></symbol>
  <symbol id="i-volume" viewBox="0 0 32 32"><path fill="currentColor" d="M3 11h6l8-7v24l-8-7H3zm18 0a7 7 0 0 1 0 10l-2-2a4 4 0 0 0 0-6zm3.5-4a12 12 0 0 1 0 18l-2-2a9 9 0 0 0 0-14z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 32 32"><path fill="currentColor" d="M3 11h6l8-7v24l-8-7H3zm17.5 1.5 2-2L25 13l2.5-2.5 2 2L27 15l2.5 2.5-2 2L25 17l-2.5 2.5-2-2L23 15z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 32 32"><path fill="currentColor" fill-rule="evenodd" d="M13.5 2h5l.8 3.6 2.4 1 3.1-2 3.6 3.6-2 3.1 1 2.4 3.6.8v5l-3.6.8-1 2.4 2 3.1-3.6 3.6-3.1-2-2.4 1-.8 3.6h-5l-.8-3.6-2.4-1-3.1 2-3.6-3.6 2-3.1-1-2.4L2 18.5v-5l3.6-.8 1-2.4-2-3.1 3.6-3.6 3.1 2 2.4-1zM16 11a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></symbol>
</svg>

<script src="app.js"></script>
</body>
</html>
