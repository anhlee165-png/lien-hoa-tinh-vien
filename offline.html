<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d0a0a">
<title>Mất kết nối · Liên Hoa Tịnh Viện</title>
<style>
  html,body{margin:0;height:100%;background:#2a0808;color:#f6e7c8;font:500 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:120px;height:120px;border-radius:24px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
  h1{font:800 26px/1.2 Georgia,"Noto Serif",serif;color:#ffd77a;margin:18px 0 6px}
  p{max-width:420px;margin:6px 0;opacity:.9}
  button{margin-top:18px;padding:12px 26px;border:0;border-radius:12px;background:linear-gradient(#e8b54a,#a8701c);color:#2a0808;font:700 17px system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/assets/app/icon-192.png" alt="">
  <h1>Liên Hoa Tịnh Viện</h1>
  <p>Máy đang mất kết nối Internet.</p>
  <p>Chánh điện cần mạng để gặp đại chúng, nên chưa vào chùa được. Khi có mạng lại, mời đạo hữu bấm nút dưới đây. 🙏</p>
  <button onclick="location.reload()">Vào lại chùa</button>
</main>
<script>addEventListener('online', () => location.reload());</script>
</body>
</html>
